name: Scrape Gruns

on:
  schedule:
    - cron: "50 6 * * *" # daily at 06:50 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max ads to scrape (integer, or 'none' for no limit)"
        required: false
        default: "none"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run gruns scraper
        env:
          DATABASE_HOSTNAME: ${{ secrets.DATABASE_HOSTNAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: xvfb-run -a python -m app.runner gruns --limit "${{ inputs.limit || 'none' }}"

      - name: Upload scraped data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data-gruns
          path: app/test/scraped_data.json
          if-no-files-found: ignore
